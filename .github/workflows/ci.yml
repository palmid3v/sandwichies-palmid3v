name: Sandwichies CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: Dependency audit report
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node -e 'try { const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8")); const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map((entry) => typeof entry === "string" ? entry : entry.title) })); console.log(JSON.stringify({ totals: report.metadata?.vulnerabilities, vulnerabilities }, null, 2)); } catch (error) { console.log("Dependency audit report unavailable:", error.message); }'

      - name: Lint
        run: npm run lint

      - name: Validate local and release scripts syntax
        run: node --check scripts/local-preflight.mjs && node --check scripts/release-verify.mjs

      - name: Unit and domain tests
        run: npm test

      - name: Cloudflare Worker tests
        run: npm run worker:test

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore security regression
        run: npm run security:test

      - name: Inventory Functions + Firestore integration
        run: npm run integration:test

      - name: Production build
        run: npm run build

      - name: Start preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/sandwichies-preview.log 2>&1 &

      - name: Entrypoint smoke baseline
        run: |
          sleep 3
          SMOKE_BASE_URL=http://127.0.0.1:4173 npm run smoke
